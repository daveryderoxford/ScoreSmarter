<app-toolbar [title]="title()">
  <a
    class="scoresmarter-app-link"
    href="https://scoresmarter.app"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="ScoreSmarter project homepage">
    <img src="favicon-32x32.png" alt="" width="32" height="32" />
  </a>
</app-toolbar>
<div class="content">
  <mat-card class="home-card">
    <div class="club-header">
      <app-club-logo
        size="lg"
        [showPlaceholder]="false"
        alt="Club logo" />
      <h1 class="club-title">{{ clubStore.club().name }}</h1>
    </div>
    
    <mat-card-content>
      <div class="actions">
        <a matButton="tonal" routerLink="/entry/enter">
          <mat-icon>assignment</mat-icon>
          <span>Entry</span>
        </a>
        <button matButton="tonal" type="button" [matMenuTriggerFor]="inputResultsMenu">
          <mat-icon>list_alt</mat-icon>
          <span>Input results</span>
          <mat-icon iconPositionEnd>arrow_drop_down</mat-icon>
        </button>
        <mat-menu #inputResultsMenu="matMenu">
          <a mat-menu-item routerLink="/results-input/manual">
            <mat-icon>schedule</mat-icon>
            <span>Manual input</span>
          </a>
          <a mat-menu-item routerLink="/results-input/scan-scoring-sheet">
            <mat-icon>document_scanner</mat-icon>
            <span>Scan scoring sheet</span>
          </a>
        </mat-menu>
        <a matButton="tonal" routerLink="/results/viewer">
          <mat-icon>emoji_events</mat-icon>
          <span>Results</span>
        </a>
      </div>

      @defer (on idle) {
        <div class="home-panels" [class.home-panels--single]="!showDuties()">
          <app-home-races-section />
          @if (showDuties()) {
            <app-home-duties-section />
          }
        </div>
      } @placeholder {
        <p class="placeholder">Loading today's races…</p>
      }
    </mat-card-content>
  </mat-card>
</div>
