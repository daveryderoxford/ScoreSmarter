<app-toolbar title="Scan Results Sheet"></app-toolbar>

<mat-stepper class="stepper" [linear]="true" #stepper [orientation]="isMobile() ? 'vertical' : 'horizontal'"
  (selectionChange)="onStepChange($event)">

  <mat-step [completed]="!!raceSelection.selectedRaceId()">
    <ng-template matStepLabel>Race</ng-template>
    <div class="step-container">
      <app-race-step />

      <div class="step-actions">
        @if (scanRun.hasStoredScan()) {
          <h3>Saved scan exists</h3>
          <div>
            <button matButton="text" type="button" (click)="discardSavedScan()">Discard</button>
            <button matButton="filled" type="button" (click)="useSavedScan()">Use Saved</button>
          </div>
        } @else {
          <button matButton="filled" type="button" matStepperNext
            [disabled]="!raceSelection.selectedRaceId() || scanRun.storedScan.isLoading()"
            style="margin-left:auto;">Next</button>
        }
      </div>
    </div>
  </mat-step>

  <mat-step [completed]="sheetCapture.hasImage() || !!scanRun.scanResult()">
    <ng-template matStepLabel>Capture</ng-template>
    <div class="step-container">
      <app-capture-step [vm]="captureVm()"
        (fileChanged)="onCaptureFile($event)"
        (openCamera)="onOpenCameraCapture()"
        (startPhoneCapture)="onStartPhoneCapture()"
        (captureNewInstead)="onCaptureNewInstead()"
        (clearImage)="sheetCapture.clear()" />
      <div class="step-actions">
        <button matButton matStepperPrevious>Previous</button>
        <button matButton="filled" type="button"
          [disabled]="!sheetCapture.hasImage() || capturePersisting()"
          (click)="onCaptureStepNext()">
          {{ capturePersisting() ? 'Saving…' : 'Next' }}
        </button>
      </div>
    </div>
  </mat-step>

  <mat-step [completed]="(scanRun.contextForm.valid && raceSelection.hasConfiguredStartTimes()) || !!scanRun.scanResult()">
    <ng-template matStepLabel>Details</ng-template>
    <div class="step-container">
      <app-setup-step />
      <div class="step-actions">
        <button matButton matStepperPrevious>Previous</button>
        <button matButton="filled" type="button" matStepperNext
          [disabled]="scanRun.contextForm.invalid || !raceSelection.hasConfiguredStartTimes()"
          style="margin-left:auto;">Next</button>
      </div>
    </div>
  </mat-step>

  <mat-step>
    <ng-template matStepLabel>Review</ng-template>
    <div class="step-container review-container">
      <app-review-step (backRequested)="goToPreviousStep()" />
    </div>
  </mat-step>
</mat-stepper>
