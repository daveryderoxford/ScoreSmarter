<form [formGroup]="form" class="competitor-edit-form" (ngSubmit)="onSubmit()">
  <app-result-code-select formControlName="resultCode" />

  @if (isHandicapRace()) {
    <mat-form-field class="field-full">
      <mat-label>Start time</mat-label>
      <app-race-time-input
        formControlName="startTime"
        [mode]="timeInputContext().mode"
        [baseTime]="timeInputContext().baseTime"
        [scheduledStart]="race().scheduledStart"
      />
      <mat-hint>Leave blank to use fleet start time</mat-hint>
    </mat-form-field>

    <mat-form-field class="field-full">
      <mat-label>Finish time</mat-label>
      <app-race-time-input
        formControlName="manualFinishTime"
        [mode]="timeInputContext().mode"
        [baseTime]="timeInputContext().baseTime"
        [scheduledStart]="race().scheduledStart"
      />
    </mat-form-field>

    <mat-form-field class="field-full">
      <mat-label>Laps</mat-label>
      <input matInput type="number" formControlName="manualLaps" min="1" />
    </mat-form-field>
  } @else {
    <mat-form-field class="field-full">
      <mat-label>Position</mat-label>
      <input matInput type="number" formControlName="manualPosition" min="1" />
    </mat-form-field>
  }

  <mat-form-field class="field-full">
    <mat-label>Crew</mat-label>
    <input matInput formControlName="crew" autocomplete="off" />
    <mat-hint>Applies to this race only</mat-hint>
  </mat-form-field>

  <div class="actions">
    <button mat-button type="button" (click)="onCancel()">Cancel</button>
    <app-submit-button [disabled]="form.invalid">Save</app-submit-button>
  </div>
</form>
