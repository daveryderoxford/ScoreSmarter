<form [formGroup]="form" class="competitor-edit-form" (ngSubmit)="onSubmit()">
  <p class="merge-hint">{{ mergeHint() }}</p>
  <p class="merge-hint">Changing identity for this race may create or merge series entries.</p>

  <mat-form-field class="field-full">
    <mat-label>Helm</mat-label>
    <input matInput formControlName="helm" autocomplete="name" autocapitalize="words" />
    @if (form.controls.helm.hasError('required')) {
      <mat-error>Helm required</mat-error>
    }
  </mat-form-field>

  <div class="row class-and-sail">
    <mat-form-field class="field-class">
      <mat-label>Boat class</mat-label>
      <mat-select formControlName="boatClass" [compareWith]="compareBoatClass">
        @for (name of classOptions(); track name) {
          <mat-option [value]="name">{{ name }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-form-field class="field-sail">
      <mat-label>Sail #</mat-label>
      <input matInput type="number" inputmode="numeric" formControlName="sailNumber" />
    </mat-form-field>
  </div>

  <div class="actions">
    <button mat-button type="button" (click)="onCancel()">Cancel</button>
    <app-submit-button [disabled]="form.invalid">Save</app-submit-button>
  </div>
</form>
