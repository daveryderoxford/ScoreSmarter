@if (variant() === 'button') {
  <button
    matButton
    type="button"
    [disabled]="disabled()"
    [matMenuTriggerFor]="editMenu"
  >
    {{ triggerLabel() }}
    <mat-icon iconPositionEnd>arrow_drop_down</mat-icon>
  </button>

  <mat-menu #editMenu="matMenu">
    <ng-container *ngTemplateOutlet="items" />
  </mat-menu>
} @else {
  <ng-container *ngTemplateOutlet="items" />
}

<ng-template #items>
  <button mat-menu-item type="button" (click)="openEntryEdit()">
    <span class="menu-item-body">
      <span class="menu-item-title">Edit entry</span>
      <span class="menu-item-hint">Helm, boat, crew, handicaps and divisions</span>
    </span>
  </button>
  <button mat-menu-item type="button" (click)="openRaceResultData()">
    <span class="menu-item-body">
      <span class="menu-item-title">Race Results</span>
      <span class="menu-item-hint">Override race result data</span>
    </span>
  </button>
  <div class="delete-container">
  <button matButton="filled" type="button" class="delete-button" (click)="confirmDelete()">
      Delete Race Entry
  </button>
</div>

</ng-template>
