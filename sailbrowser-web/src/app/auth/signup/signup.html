<app-page-layout>
<app-toolbar title="ScoreSmarter Signup"></app-toolbar>

<app-detail-pane maxWidth="400px">
<form [formGroup]="signupForm" (ngSubmit)="signup()">

   <mat-form-field>
      <mat-label>First name</mat-label>
      <input matInput formControlName="firstname" autocomplete="given-name">
      <mat-error>First name is required</mat-error>
   </mat-form-field>

   <mat-form-field>
      <mat-label>Last name</mat-label>
      <input matInput formControlName="surname" autocomplete="family-name">
      <mat-error>Last name is required</mat-error>
   </mat-form-field>

   <mat-form-field>
      <mat-label>Email</mat-label>
      <input matInput formControlName="email" type="email">
      <mat-error>Invalid email</mat-error>
   </mat-form-field>

   <mat-form-field>
      <mat-label>Password</mat-label>
      <input matInput formControlName="password" [type]="hidePassword() ? 'password' : 'text'">
      <button mat-icon-button matSuffix type="button"
         (click)="hidePassword.set(!hidePassword())"
         [attr.aria-label]="hidePassword() ? 'Show password' : 'Hide password'"
         [attr.aria-pressed]="!hidePassword()">
         <mat-icon>{{ hidePassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
      </button>
      <mat-error>Password of 6 or more characters required</mat-error>
   </mat-form-field>

   <mat-form-field>
      <mat-label>Confirm Password</mat-label>
      <input matInput formControlName="confirmPassword" [type]="hideConfirmPassword() ? 'password' : 'text'">
      <button mat-icon-button matSuffix type="button"
         (click)="hideConfirmPassword.set(!hideConfirmPassword())"
         [attr.aria-label]="hideConfirmPassword() ? 'Show confirm password' : 'Hide confirm password'"
         [attr.aria-pressed]="!hideConfirmPassword()">
         <mat-icon>{{ hideConfirmPassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
      </button>
      <mat-error>Confirm password required</mat-error>
      @if(signupForm.errors && signupForm.errors['passwordMissMatch']) {
         <mat-hint class=error>Passwords do not match</mat-hint>
      }
   </mat-form-field>

   <div fxLayout="row" fxLayoutAlign="space-between center">
      <button [disabled]="signupForm.invalid || loading()" matButton="filled" type="submit" aria-label="Signup">Sign up</button>
      <a mat-button routerLink="/auth/login">Already have user name</a>
   </div>

</form>
</app-detail-pane>
</app-page-layout>
