<app-page-layout>
<app-toolbar title="Edit race details" showBack />
<app-detail-pane maxWidth="350px">
<form (ngSubmit)="submit()" [formGroup]="form" novalidate>
  <mat-form-field>
    <mat-label>Race date</mat-label>
    <input matInput [matDatepicker]="datePicker" formControlName="startDate">
    <mat-datepicker-toggle matIconSuffix [for]="datePicker" />
    <mat-datepicker #datePicker />
    <mat-hint>Change the date to reschedule a postponed race</mat-hint>
    <mat-error>Race date required</mat-error>
  </mat-form-field>

  <mat-form-field>
    <mat-label>Scheduled start time</mat-label>
    <input matInput appTimeInput formControlName="startTime">
    <mat-error>Start time required</mat-error>
  </mat-form-field>

  <div class="type-display">Race type: <strong>{{ derivedRaceTypeLabel() }}</strong></div>

  @if (!isPrimaryLevelRatingSeries()) {
    <mat-checkbox formControlName="isPursuit">Pursuit race</mat-checkbox>
  }

  <mat-checkbox formControlName="isDiscardable">Is discardable</mat-checkbox>
  <mat-checkbox formControlName="isAverageLap">Is the race an average lap race</mat-checkbox>

  <div>
    <app-submit-button [disabled]="form.invalid || !form.dirty" [busy]="busy()">
      Save
    </app-submit-button>
  </div>

</form>
</app-detail-pane>
</app-page-layout>
