<mat-list-item>

   <span matListItemTitle>Race {{race().index}}<span class="gap"></span>{{ race().scheduledStart | date:'MMM d, y'}}@if (race().raceOfDay > 1) { / {{race().raceOfDay}}}</span>
   <span matListItemLine>
      <span class="details-line">
         <span>Start: <span class="start-time">{{ race().scheduledStart | date:'HH:mm' }}</span></span>
         @if (race().isAverageLap) {
         <span>Average lap</span>
         }
         @if (race().type !== 'Handicap') {
         <span>{{ race().type }}</span>
         }
         <span class="status-pill" [attr.data-status]="statusTone()">{{ race().status }}</span>
      </span>
   </span>
   <span matListItemMeta>
      <button matIconButton (click)="edit.emit(race())">
         <mat-icon class="green">edit</mat-icon>
      </button>
      <button matIconButton (click)="delete.emit(race())" [disabled]="disableDelete()" [title]="disableDelete() ? 'Cannot delete published race' : 'Delete race'">
         <mat-icon class="warning">delete</mat-icon>
      </button>
   </span>

</mat-list-item>
