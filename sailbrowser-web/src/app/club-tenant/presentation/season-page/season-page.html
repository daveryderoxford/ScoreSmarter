<app-page-layout>
  <app-toolbar [title]="toolbarTitle()" [showBack]="showBack()" />

  <app-list-detail-layout [detailOpen]="detailOpen()" detailWidth="400px">
    <app-list-pane list>
      <div listHeader class="search-bar">
        <mat-form-field class="search">
          <mat-label>Search Seasons</mat-label>
          <input matInput [formControl]="searchControl" placeholder="Search by name">
          <mat-icon matSuffix>search</mat-icon>
        </mat-form-field>

        <a matButton="tonal" class="right-justify" routerLink="add">
          New
        </a>
      </div>

      @if (cs.isLoading()) {
        <app-loading-centered />
      } @else {
        <mat-list>
          @for (season of filteredSeasons(); track season.id) {
          <mat-list-item [routerLink]="['edit', season.id]" [activated]="selectedSeasonId() === season.id">
            <span matListItemTitle>{{ season.name }}</span>
            <span matListItemLine>{{ season.status === 'archived' ? 'Archived' : 'Current' }}</span>
          </mat-list-item>
          <mat-divider></mat-divider>
          } @empty {
          <mat-list-item>
            <span matListItemTitle>No seasons found</span>
          </mat-list-item>
          }
        </mat-list>
      }
    </app-list-pane>

    <app-detail-pane detail maxWidth="350px" fillHeight>
      <router-outlet />
    </app-detail-pane>
  </app-list-detail-layout>
</app-page-layout>
